# Optional local services.
#
# Nothing here is required any more: Postgres runs on Aiven, speech-to-text on
# Groq, and text-to-speech on a local Kokoro server. These definitions are kept
# behind profiles so a machine with no network - or a contributor who wants the
# whole stack local - can still bring them up:
#
#   docker compose --profile local-db up -d postgres
#   docker compose --profile local-ai up -d ollama
#
# Host ports are configurable so a shared server with occupied ports never
# requires editing this tracked file - set them in a gitignored root `.env`
# instead. Editing this file on a server is what makes `git pull` conflict.
services:
  postgres:
    image: pgvector/pgvector:pg18
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: docent
      POSTGRES_USER: docent
      POSTGRES_PASSWORD: docent
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - docent_postgres:/var/lib/postgresql
      - ./docker/postgres/init/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docent -d docent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - docent_ollama:/root/.ollama
    restart: unless-stopped



volumes:
  docent_postgres:
  docent_ollama:
