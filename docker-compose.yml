services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: docent
      POSTGRES_USER: docent
      POSTGRES_PASSWORD: docent
    ports:
      - "5434:5432"
    volumes:
      - docent_postgres:/var/lib/postgresql
      - ./docker/postgres/init/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docent -d docent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - docent_ollama:/root/.ollama
    restart: unless-stopped

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    profiles: ["voice"]
    entrypoint: ["/bin/sh", "-c"]
    # `base-q5_1` is the latency/accuracy sweet spot for realtime calls on CPU;
    # swap WHISPER_MODEL for `small` or `medium` if you have a GPU to spare.
    command:
      - >-
        test -f /models/ggml-${WHISPER_MODEL:-base-q5_1}.bin ||
        ./models/download-ggml-model.sh ${WHISPER_MODEL:-base-q5_1} /models;
        exec whisper-server --host 0.0.0.0 --port 8080
        --model /models/ggml-${WHISPER_MODEL:-base-q5_1}.bin --convert
        --threads ${WHISPER_THREADS:-4} --no-timestamps
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - docent_whisper:/models
    restart: unless-stopped

  # Self-hosted text to speech behind an OpenAI-compatible /v1/audio/speech
  # endpoint, so the same client code works against any compatible server.
  # Ships Piper voices, which synthesize faster than realtime on CPU.
  speech:
    image: ghcr.io/matatonic/openedai-speech-min:latest
    profiles: ["voice"]
    environment:
      # The image defaults both of these to the relative path `voices`, which
      # resolves to /app/voices from its workdir. Pinned to the absolute path so
      # downloaded voices and models always land in the mounted volume and
      # survive `docker compose down`.
      TTS_HOME: /app/voices
      HF_HOME: /app/voices
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - docent_speech:/app/voices
    restart: unless-stopped

volumes:
  docent_postgres:
  docent_ollama:
  docent_whisper:
  docent_speech:
